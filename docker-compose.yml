services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    image: geth-mbft:latest
    pull_policy: build
    container_name: mbft-node1
    hostname: node1
    entrypoint: ["/entrypoint.sh"]
    environment:
      - ETHERBASE=0x7E5F4552091A69125d5DfCb7b8C2659029395Bdf
      - NETWORK_ID=1337
      - RPC_PORT=8545
      - WS_PORT=8546
      - P2P_PORT=30303
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    volumes:
      - ./docker/mbft/genesis.json:/genesis.json:ro
      - ./docker/mbft/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/mbft/password.txt:/config/password.txt:ro
      - ./docker/mbft/node1/keystore:/config/keystore:ro
      - ./docker/mbft/node1/nodekey:/config/nodekey:ro
      - node1-data:/data
    networks:
      mbft-net:
        ipv4_address: 172.20.0.11

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    image: geth-mbft:latest
    pull_policy: build
    container_name: mbft-node2
    hostname: node2
    entrypoint: ["/entrypoint.sh"]
    environment:
      - ETHERBASE=0x2B5AD5c4795c026514f8317c7a215E218DcCD6cF
      - NETWORK_ID=1337
      - RPC_PORT=8545
      - WS_PORT=8546
      - P2P_PORT=30303
    ports:
      - "8547:8545"
      - "8548:8546"
      - "30304:30303"
    volumes:
      - ./docker/mbft/genesis.json:/genesis.json:ro
      - ./docker/mbft/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/mbft/password.txt:/config/password.txt:ro
      - ./docker/mbft/node2/keystore:/config/keystore:ro
      - ./docker/mbft/node2/nodekey:/config/nodekey:ro
      - node2-data:/data
    depends_on:
      - node1
    networks:
      mbft-net:
        ipv4_address: 172.20.0.12

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    image: geth-mbft:latest
    pull_policy: build
    container_name: mbft-node3
    hostname: node3
    entrypoint: ["/entrypoint.sh"]
    environment:
      - ETHERBASE=0x6813Eb9362372EEF6200f3b1dbC3f819671cBA69
      - NETWORK_ID=1337
      - RPC_PORT=8545
      - WS_PORT=8546
      - P2P_PORT=30303
    ports:
      - "8549:8545"
      - "8550:8546"
      - "30305:30303"
    volumes:
      - ./docker/mbft/genesis.json:/genesis.json:ro
      - ./docker/mbft/entrypoint.sh:/entrypoint.sh:ro
      - ./docker/mbft/password.txt:/config/password.txt:ro
      - ./docker/mbft/node3/keystore:/config/keystore:ro
      - ./docker/mbft/node3/nodekey:/config/nodekey:ro
      - node3-data:/data
    depends_on:
      - node1
    networks:
      mbft-net:
        ipv4_address: 172.20.0.13

networks:
  mbft-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  node1-data:
  node2-data:
  node3-data:
